model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  torch_dtype: float32
  device: cuda
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
  - q_proj
  - v_proj
  bias: none
training:
  local_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  max_seq_length: 256
federated:
  num_rounds: 15
  num_clients: 10
  clients_per_round: 10
  aggregation_method: fedit
evaluation:
  eval_every: 1
  eval_batch_size: 4
  metrics:
  - loss
  - perplexity
checkpointing:
  save_every: 5
  keep_last_n: 1
seed: 42
data:
  dataset_name: databricks/databricks-dolly-15k
  dataset_split: train
  max_samples: 3000
  partition_method: label_skew
  eval_split: null
  eval_samples: 300
  partition_alpha: 0.5
  label_column: category
  require_label_column: true
experiment:
  name: vp_tl_fedit_a05
  description: Partition-variance study | fedit | TinyLlama-1.1B | Dolly-3k | alpha0.5
